apiVersion: 1
providers:
  - name: openegiz
    folder: OpenEgiz
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
  # Filled by example overlays (examples/*/compose.yml); empty otherwise.
  - name: examples
    folder: OpenEgiz Examples
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/example-dashboards
  # Filled by team/mine/compose.yml; empty otherwise. Separate from the two
  # providers above: our dashboard is neither a platform default nor an
  # Example, and shouldn't be filed under either folder.
  - name: team
    folder: Участок карьера
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/team-dashboards
